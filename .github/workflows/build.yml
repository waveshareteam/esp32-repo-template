name: Build Examples

# Reusable workflow. A product repository calls it from .github/workflows/build.yml
# and supplies every product-specific value through .github/product.json.

on:
  workflow_call:
    inputs:
      examples:
        description: "all, an example directory name, or a repo-relative example path"
        type: string
        required: false
        default: "all"
      template_repository:
        description: "Repository that provides ci/ and defaults/"
        type: string
        required: false
        default: "waveshareteam/esp32-repo-template"
      template_ref:
        # TODO(verify): this must name the same ref as the caller's `uses: ...@v1`. A called
        # workflow cannot reliably read its own ref from the `github` context, so the ref is
        # repeated here. Confirm whether `job.workflow_sha` is available on the runners in use
        # and switch to it if so.
        description: "Ref of the template repository to check out"
        type: string
        required: false
        default: "v1"

permissions:
  contents: read

# TODO(verify): top-level concurrency inside a called workflow. The group is prefixed so it cannot
# collide with a group declared by the caller.
concurrency:
  group: template-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  TEMPLATE_DIR: .ci-template

jobs:
  classify-changes:
    runs-on: ubuntu-latest
    outputs:
      routing: ${{ steps.classify.outputs.routing }}
      idf_mode: ${{ steps.classify.outputs.idf_mode }}
      idf_selector: ${{ steps.classify.outputs.idf_selector }}
      arduino_mode: ${{ steps.classify.outputs.arduino_mode }}
      arduino_selector: ${{ steps.classify.outputs.arduino_selector }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      firmware_changed: ${{ steps.classify.outputs.firmware_changed }}
      release_review: ${{ steps.classify.outputs.release_review }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # TODO(verify): if the template repository is private, this checkout needs a token with
      # read access to it (the caller passes `secrets: inherit`).
      - name: Check out the shared CI template
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.template_repository }}
          ref: ${{ inputs.template_ref }}
          path: ${{ env.TEMPLATE_DIR }}
      - name: Validate product.json
        run: python3 "$TEMPLATE_DIR/ci/product_config.py" --product .github/product.json
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          if [ "$FORCE_ALL" = "true" ]; then
            python3 "$TEMPLATE_DIR/ci/classify_changes.py" --repo . --all --product .github/product.json --github-output "$GITHUB_OUTPUT"
          else
            # TODO(verify): callers trigger on every branch push. The first push of a new branch
            # reports an all-zero `before` SHA, so the complete diff is taken against the default
            # branch instead. Anything else that leaves the diff unavailable still fails closed.
            if [[ "$BASE" =~ ^0+$ ]]; then
              BASE="origin/$DEFAULT_BRANCH"
            fi
            if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" || ! git cat-file -e "${HEAD}^{commit}"; then
              echo "A complete base/head diff is required for CI routing." >&2
              exit 2
            fi
            git -c core.quotepath=false diff --name-status --find-renames "$BASE...$HEAD" > "$RUNNER_TEMP/changed-files.txt"
            python3 "$TEMPLATE_DIR/ci/classify_changes.py" --repo . --changed-files-from "$RUNNER_TEMP/changed-files.txt" --product .github/product.json --github-output "$GITHUB_OUTPUT"
          fi
      - name: Summarize change routing
        env:
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only }}
          FIRMWARE_CHANGED: ${{ steps.classify.outputs.firmware_changed }}
          RELEASE_REVIEW: ${{ steps.classify.outputs.release_review }}
          IDF_MODE: ${{ steps.classify.outputs.idf_mode }}
          ARDUINO_MODE: ${{ steps.classify.outputs.arduino_mode }}
        run: |
          {
            echo "### Example CI routing"
            echo "- Documentation-only: $DOCS_ONLY"
            echo "- ESP-IDF route: $IDF_MODE"
            echo "- Arduino route: $ARDUINO_MODE"
            echo "- Firmware scope touched: $FIRMWARE_CHANGED"
            echo "- Immutable artifact review required: $RELEASE_REVIEW"
          } >> "$GITHUB_STEP_SUMMARY"

  discover-esp-idf:
    needs: classify-changes
    if: needs.classify-changes.outputs.idf_mode != 'none'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out the shared CI template
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.template_repository }}
          ref: ${{ inputs.template_ref }}
          path: ${{ env.TEMPLATE_DIR }}
      - id: discover
        env:
          SELECTOR: ${{ github.event_name == 'workflow_dispatch' && inputs.examples || needs.classify-changes.outputs.idf_selector }}
        run: |
          python3 "$TEMPLATE_DIR/ci/discover_examples.py" \
            --surface esp-idf \
            --selector "$SELECTOR" \
            --product .github/product.json \
            --github-output "$GITHUB_OUTPUT"

  build-esp-idf:
    needs: discover-esp-idf
    if: needs.discover-esp-idf.outputs.count != '0'
    runs-on: ubuntu-latest
    container: espressif/idf:${{ matrix.idf }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-esp-idf.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out the shared CI template
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.template_repository }}
          ref: ${{ inputs.template_ref }}
          path: ${{ env.TEMPLATE_DIR }}
      - name: Build ${{ matrix.path }} with ESP-IDF ${{ matrix.idf }}
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py --version
          idf.py -C "${{ matrix.path }}" -B "build/${{ matrix.name }}-${{ matrix.idf }}" set-target "${{ matrix.target }}" build
      - name: Package firmware
        shell: bash
        run: |
          python3 "$TEMPLATE_DIR/ci/package_firmware.py" \
            --framework esp-idf \
            --project "${{ matrix.path }}" \
            --build-dir "build/${{ matrix.name }}-${{ matrix.idf }}" \
            --name "${{ matrix.product }}-${{ matrix.name }}-${{ matrix.idf }}" \
            --framework-version "${{ matrix.idf }}" \
            --target "${{ matrix.target }}" \
            --git-sha "${{ github.sha }}" \
            --output-dir release-artifacts
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp-idf-${{ matrix.name }}-${{ matrix.idf }}
          path: release-artifacts/*.zip
          if-no-files-found: error

  discover-arduino:
    needs: classify-changes
    if: needs.classify-changes.outputs.arduino_mode != 'none'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out the shared CI template
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.template_repository }}
          ref: ${{ inputs.template_ref }}
          path: ${{ env.TEMPLATE_DIR }}
      - id: discover
        env:
          SELECTOR: ${{ github.event_name == 'workflow_dispatch' && inputs.examples || needs.classify-changes.outputs.arduino_selector }}
        run: |
          python3 "$TEMPLATE_DIR/ci/discover_examples.py" \
            --surface arduino \
            --selector "$SELECTOR" \
            --product .github/product.json \
            --github-output "$GITHUB_OUTPUT"

  build-arduino:
    needs: discover-arduino
    if: needs.discover-arduino.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-arduino.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out the shared CI template
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.template_repository }}
          ref: ${{ inputs.template_ref }}
          path: ${{ env.TEMPLATE_DIR }}
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 Arduino core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${{ matrix.core }}
      - name: Compile ${{ matrix.path }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ino_files < <(find "${{ matrix.path }}" -maxdepth 1 -name "*.ino" | sort)
          if [[ "${#ino_files[@]}" -eq 0 ]]; then
            echo "No .ino file found in ${{ matrix.path }}" >&2
            exit 1
          fi
          sketch_name="$(basename "${ino_files[0]}" .ino)"
          normalized_sketch="$RUNNER_TEMP/arduino-sketches/$sketch_name"
          mkdir -p "$normalized_sketch"
          cp -R "${{ matrix.path }}/." "$normalized_sketch/"
          arduino-cli compile \
            --fqbn "${{ matrix.fqbn }}" \
            --libraries examples/arduino/libraries \
            --export-binaries \
            --output-dir "build/${{ matrix.name }}-${{ matrix.core }}" \
            "$normalized_sketch"
      - name: Package firmware
        run: |
          python3 "$TEMPLATE_DIR/ci/package_firmware.py" \
            --framework arduino \
            --project "${{ matrix.path }}" \
            --build-dir "build/${{ matrix.name }}-${{ matrix.core }}" \
            --name "${{ matrix.product }}-${{ matrix.name }}-arduino-${{ matrix.core }}" \
            --framework-version "${{ matrix.core }}" \
            --target "${{ matrix.target }}" \
            --git-sha "${{ github.sha }}" \
            --output-dir release-artifacts
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-arduino-${{ matrix.name }}-${{ matrix.core }}
          path: release-artifacts/*.zip
          if-no-files-found: error
